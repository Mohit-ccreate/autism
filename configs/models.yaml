# Tabular model hyperparameter grid for inner-CV search
models:
  logistic_regression:
    C: [0.001, 0.01, 0.1, 1.0, 10.0]
    penalty: ["l2"]
    max_iter: [1000]

  linear_svm:
    C: [0.001, 0.01, 0.1, 1.0]
    kernel: ["linear"]

  random_forest:
    n_estimators: [100, 200]
    max_depth: [3, 5, 10, null]
    min_samples_leaf: [1, 5]

  extra_trees:
    n_estimators: [100, 200]
    max_depth: [3, 5, 10, null]
    min_samples_leaf: [1, 5]

  xgboost:
    n_estimators: [50, 100]
    max_depth: [3, 5]
    learning_rate: [0.05, 0.1]

  lightgbm:
    n_estimators: [50, 100]
    max_depth: [3, 5]
    learning_rate: [0.05, 0.1]
    verbosity: [-1]

  mlp:
    hidden_layer_sizes: [[64, 32], [128, 64]]
    alpha: [0.001, 0.01]
    max_iter: [500]

abide_models:
  logistic_regression:
    C: [0.001, 0.01, 0.1, 1.0]
    penalty: ["l2"]

  linear_svm:
    C: [0.001, 0.01, 0.1, 1.0]
    kernel: ["linear"]

  random_forest:
    n_estimators: [100]
    max_depth: [3, 5]

feature_selection:
  k_values: [50, 100, 250, 500]
  default_k: 250
  method: "anova_f"
